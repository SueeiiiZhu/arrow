<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Escape Arrows</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #app { display: flex; flex-direction: column; height: 100%; }
      header { padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: #1e293b; }
      header label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
      header select, header input { background: #0f172a; color: #e2e8f0; border: 1px solid #334155; padding: 4px 8px; border-radius: 4px; }
      header button { background: #3b82f6; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; }
      header button:hover { background: #2563eb; }
      header button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
      header button:disabled:hover { background: #475569; }
      #picker-btn { background: #334155; }
      #picker-btn:hover { background: #475569; }
      #undo-btn { background: #64748b; }
      #undo-btn:hover:not(:disabled) { background: #475569; }
      #hint-btn { background: #f59e0b; }
      #hint-btn:hover:not(:disabled) { background: #d97706; }
      main { flex: 1; position: relative; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .info { position: absolute; bottom: 8px; left: 8px; font-size: 12px; opacity: 0.6; }

      #picker-panel { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: rgba(15,23,42,0.95); }
      #picker-panel[hidden] { display: none; }
      .picker-head { display: flex; gap: 8px; padding: 12px; background: #1e293b; align-items: center; border-bottom: 1px solid #334155; }
      #picker-search { flex: 1; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; padding: 8px 12px; border-radius: 4px; font-size: 14px; }
      #picker-count { font-size: 12px; opacity: 0.7; white-space: nowrap; }
      #picker-close { background: #ef4444; color: white; border: none; width: 32px; height: 32px; border-radius: 4px; cursor: pointer; font-size: 18px; line-height: 1; }
      #picker-tags { padding: 8px 12px; display: flex; gap: 6px; flex-wrap: wrap; background: #1e293b; border-bottom: 1px solid #334155; }
      .picker-tag { padding: 4px 10px; border-radius: 12px; font-size: 12px; background: #334155; color: #e2e8f0; cursor: pointer; user-select: none; }
      .picker-tag.active { background: #3b82f6; }
      #picker-list { flex: 1; overflow-y: auto; background: #0f172a; }
      .picker-row { padding: 10px 14px; border-bottom: 1px solid #1e293b; cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: 13px; }
      .picker-row:hover { background: #1e293b; }
      .picker-row.current { background: #1e3a5f; }
      .picker-row .picker-idx { color: #64748b; min-width: 60px; font-variant-numeric: tabular-nums; font-size: 11px; }
      .picker-row .picker-name { flex: 1; }
      .picker-row .picker-meta { font-size: 11px; opacity: 0.6; white-space: nowrap; }
      .picker-row .picker-done { color: #22c55e; min-width: 14px; }
      .picker-more { padding: 14px; text-align: center; font-size: 12px; opacity: 0.7; }

      #lives { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 20px; font-size: 13px; font-variant-numeric: tabular-nums; }
      #lives-hearts { display: flex; gap: 2px; }
      .heart { width: 16px; height: 16px; display: inline-block; }
      .heart svg { display: block; }
      #lives-timer { font-size: 11px; color: #94a3b8; min-width: 38px; text-align: right; }

      #no-lives-dialog { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(15,23,42,0.78); }
      #no-lives-dialog[hidden] { display: none; }
      .nl-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px 28px; width: min(360px, calc(100% - 32px)); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
      .nl-title { font-size: 18px; font-weight: 600; margin: 0 0 6px; color: #f8fafc; }
      .nl-sub { font-size: 13px; color: #94a3b8; margin: 0 0 18px; line-height: 1.5; }
      .nl-timer { font-size: 24px; font-variant-numeric: tabular-nums; color: #f1f5f9; margin: 4px 0 18px; letter-spacing: 1px; }
      .nl-actions { display: flex; flex-direction: column; gap: 8px; }
      .nl-actions button { width: 100%; padding: 10px 14px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer; }
      #nl-ad-btn { background: #22c55e; color: white; font-weight: 600; }
      #nl-ad-btn:hover { background: #16a34a; }
      #nl-close-btn { background: transparent; color: #94a3b8; border: 1px solid #334155; }
      #nl-close-btn:hover { background: #0f172a; color: #e2e8f0; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <button id="picker-btn">关卡: <span id="picker-label">—</span></button>
        <label><input type="checkbox" id="show-paths" /> 显示路径</label>
        <button id="prev-btn">‹ 上一关</button>
        <button id="next-btn">下一关 ›</button>
        <button id="undo-btn" title="撤销上一步 (Z)" disabled>↶ 撤销</button>
        <button id="hint-btn" title="提示下一步 (H)">💡 提示</button>
        <button id="reset-btn">重开</button>
        <span id="meta" style="opacity:0.7;font-size:12px;"></span>
        <span id="lives" style="margin-left:auto;">
          <span id="lives-hearts"></span>
          <span id="lives-timer"></span>
        </span>
        <span id="status" style="font-size:13px;font-weight:600;"></span>
      </header>
      <main>
        <canvas id="board"></canvas>
        <div class="info">点箭头拉出，被挡住会停下。规则为反编译推断版。</div>
      </main>
    </div>
    <div id="no-lives-dialog" hidden>
      <div class="nl-card">
        <p class="nl-title">心已用光</p>
        <p class="nl-sub">等待心数自动恢复，或看一个广告免费补 1 颗。</p>
        <p class="nl-timer" id="nl-timer">--:--</p>
        <div class="nl-actions">
          <button id="nl-ad-btn">看广告 +1 心</button>
          <button id="nl-close-btn">稍后再来</button>
        </div>
      </div>
    </div>
    <div id="picker-panel" hidden>
      <div class="picker-head">
        <input id="picker-search" type="search" placeholder="搜索：名字 / 标签 / 尺寸 …" />
        <span id="picker-count"></span>
        <button id="picker-close" aria-label="关闭">×</button>
      </div>
      <div id="picker-tags"></div>
      <div id="picker-list"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
